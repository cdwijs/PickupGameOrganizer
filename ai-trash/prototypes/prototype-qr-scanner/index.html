<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Scanner Prototype</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <meta name="theme-color" content="#3b6ef0" />
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --border: #d6d9de;
      --text: #1c1e21;
      --muted: #5c6470;
      --accent: #3b6ef0;
      --accent-text: #ffffff;
      --ok: #2d9c4a;
      --err: #d73a49;
      --code-bg: #f0f2f5;
      /* Content column width. Kept narrow so the layout has breathing room on
         a phone and doesn't stretch on a desktop. */
      --measure: 480px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --panel: #1c1f26;
        --border: #2c313a;
        --text: #e6e8eb;
        --muted: #9aa3af;
        --accent: #4d7cff;
        --ok: #3fb950;
        --err: #ff7b72;
        --code-bg: #23272f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    header { max-width: var(--measure); margin: 0 auto 16px; }
    header h1 { margin: 0 0 4px; font-size: 20px; }
    header p { margin: 0; color: var(--muted); }
    main { max-width: var(--measure); margin: 0 auto; display: grid; gap: 16px; }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      /* Grid items default to min-width:auto, so a wide min-content child (the
         camera <select> with a long device label) would push the column past
         the viewport and scroll the page sideways. */
      min-width: 0;
    }
    section h2 {
      margin: 0 0 10px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    section h2 .pill { margin-left: auto; }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0 3px;
    }
    button {
      display: inline-block;
      padding: 6px 12px;
      margin: 4px 4px 4px 0;
      border: 1px solid var(--border);
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--panel); color: var(--text); }
    textarea, select {
      width: 100%;
      max-width: 100%;
      /* Without this a long <option> (device labels can be very long) sets the
         select's intrinsic minimum and nothing can shrink it. */
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--code-bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      resize: vertical;
    }
    select { text-overflow: ellipsis; }
    #result { min-height: 90px; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: var(--code-bg);
      color: var(--muted);
    }
    .pill.ok { color: var(--ok); }
    .pill.err { color: var(--err); }
    /* The camera preview. A 1px-tall canvas keeps the decoder's scratch
       buffer in the DOM without showing it. */
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Framing guide — purely cosmetic, the decoder scans the whole frame. */
    .viewport .reticle {
      position: absolute;
      inset: 15%;
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;
      pointer-events: none;
    }
    .viewport.scanning .reticle { border-color: var(--accent); }
    /* #canvas is the decoder's offscreen scratch buffer; #qr-canvas is shown. */
    #canvas { display: none; }
    /* Camera labels and pasted URLs have no break opportunities, so let them
       break anywhere rather than widen the column. */
    p.hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .qr-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      padding: 12px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    #qr-canvas {
      display: none;
      /* The canvas holds one device pixel per QR module times an integer
         scale, so nearest-neighbour keeps the module edges hard. */
      image-rendering: pixelated;
      background: #fff;
      border-radius: 2px;
      /* Safety net: app.js sizes the canvas to the space available, but if that
         measurement is ever off, scale down instead of scrolling the page. */
      max-width: 100%;
      height: auto;
    }
    #qr-canvas.ready { display: block; }
    .qr-placeholder { margin: 0; font-size: 12px; color: var(--muted); }
    .qr-placeholder.hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>QR Scanner Prototype</h1>
    <p>Minimal installable PWA: read a QR code with the camera, edit the text, and re-encode it
       as a new QR code.</p>
  </header>

  <main>
    <section>
      <h2>Camera <span id="engine" class="pill">engine: —</span></h2>
      <div class="viewport" id="viewport">
        <video id="video" playsinline muted></video>
        <div class="reticle"></div>
      </div>
      <canvas id="canvas"></canvas>
      <div>
        <button id="btn-start">Start scanning</button>
        <button id="btn-stop" class="secondary" disabled>Stop</button>
        <button id="btn-switch" class="secondary" disabled>Switch camera</button>
      </div>
      <label for="camera-select">Camera</label>
      <select id="camera-select" disabled><option value="">— no camera selected —</option></select>
      <p class="hint" id="status">Idle. Press “Start scanning” and grant camera access.</p>
    </section>

    <section>
      <h2>Content <span id="result-state" class="pill">nothing scanned</span></h2>
      <label for="result">Decoded QR content — editable, the code below follows what you type</label>
      <textarea id="result" placeholder="Scan a QR code, or type/paste text here…"
                spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      <div>
        <button id="btn-copy" class="secondary" disabled>Copy</button>
        <button id="btn-clear" class="secondary" disabled>Clear</button>
      </div>
      <p class="hint" id="result-meta"></p>
    </section>

    <section>
      <h2>Generated QR code <span id="qr-state" class="pill">empty</span></h2>
      <div class="qr-wrap">
        <!-- Always rendered dark-on-white, in both themes: inverted codes are a
             coin flip across scanner apps. -->
        <canvas id="qr-canvas" width="0" height="0"></canvas>
        <p class="qr-placeholder" id="qr-placeholder">Nothing to encode yet.</p>
      </div>
      <div>
        <button id="btn-download" class="secondary" disabled>Download PNG</button>
      </div>
      <p class="hint" id="qr-meta"></p>
    </section>
  </main>

  <script src="vendor/jsQR.min.js"></script>
  <script src="vendor/qrcode-generator.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>Minimal Prototype — Qt</title>
    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #screen { width: 100%; height: 100%; }
    </style>
      <!-- Injected into Qt's generated shell by build.sh: everything that turns
         the WebAssembly page into an installable, offline-capable PWA. -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#4d7cff">
    <meta name="mobile-web-app-capable" content="yes">
    <script>
      if ('serviceWorker' in navigator)
        addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    </script>
    <script>
      // Opened straight from disk? Nothing will load: Qt's loader fetches the
      // .wasm, and a browser will not fetch from file:// — Firefox reports
      // "NetworkError when attempting to fetch resource", which says nothing
      // about the cause. Say it here instead, and keep saying it: the shell
      // overwrites the status line as it fails.
      if (location.protocol === 'file:') {
        addEventListener('DOMContentLoaded', () => {
          const el = document.querySelector('#qtstatus');
          if (!el) return;
          const msg = '<b>This page has to be served over HTTP.</b><br>'
            + 'Run <code>python3 -m http.server 8080</code> in this folder, '
            + 'then open <code>http://localhost:8080/</code>.';
          new MutationObserver(() => { if (el.innerHTML !== msg) el.innerHTML = msg; })
            .observe(el, { childList: true, subtree: true, characterData: true });
          el.innerHTML = msg;
        });
      }
    </script>
  </head>
  <body onload="init()">
    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: minimal-qt</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">
        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (screen === ui)
                    screen.style.position = 'default';
                ui.style.display = 'block';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => showUi(screen),
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.minimal_qt_entry,
                        containerElements: [screen],
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script src="minimal-qt.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>

# OpenSSL target for Qt on Android: Qt's TLS backend dlopens libssl_3.so and
# libcrypto_3.so (ANDROID_OPENSSL_SUFFIX defaults to "_3"), so build exactly
# those names (and sonames) instead of the plain .so the stock target makes.
my %targets = (
    # The arch is taken from the last dash-separated word, so keep "arm64" last.
    "android-qt-arm64" => {
        inherit_from     => [ "android-arm64" ],
        shared_extension => "_3.so",
    },
);
